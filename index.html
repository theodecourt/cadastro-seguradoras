<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro e Nomeação · Segura</title>
<meta name="description" content="Formulário de cadastro e nomeação de corretoras junto às seguradoras parceiras da Segura.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#04342C; --green-700:#0F6E56; --green-600:#15805F; --green-500:#1D9E75;
    --green-100:#DDF2E9; --green-50:#F2FAF6;
    --coral:#D85A30; --coral-bg:#FBE6DC;
    --red:#C0392B; --red-bg:#FDECEA; --red-line:#F0B4AC;
    --ink:#0E1512; --ink-soft:#5C6B65; --line:#DDE7E2;
    --paper:#FFFFFF; --bg:#F6F9F7;
    --radius:16px; --shadow:0 1px 2px rgba(4,52,44,0.04), 0 8px 24px rgba(4,52,44,0.06);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brandmark{font-family:'Sora',system-ui,sans-serif;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,56px);border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;}
  .brandmark{font-weight:700;font-size:19px;color:var(--green-900);letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;}
  .brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--green-500);display:inline-block;}
  .topbar-meta{font-size:13px;color:var(--ink-soft);}
  @media (max-width:520px){ .topbar-meta{display:none;} }

  .shell{max-width:980px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,5vw,32px) 96px;}

  .setup-warn{background:#FFF4E9;border:1px solid #F0C89A;color:#8A5210;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:18px;}
  .setup-warn code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px;}

  /* tabs (macro etapas) */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);border-radius:16px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line);}
  .tab{background:var(--paper);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background .15s;}
  .tab:hover{background:var(--green-50);}
  .tab.active{background:var(--green-900);}
  .tab.active .tab-title, .tab.active .tab-sub{color:#fff;}
  .tab.active .tab-num{background:#fff;color:var(--green-900);border-color:#fff;}
  .tab.locked{cursor:not-allowed;opacity:.55;}
  .tab.locked:hover{background:var(--paper);}
  .tab-num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
  .tab.done .tab-num{background:var(--green-600);border-color:var(--green-600);color:#fff;}
  .tab.done .tab-num::before{content:"✓";}
  .tab-title{font-size:14px;font-weight:700;color:var(--ink);}
  .tab-sub{font-size:11.5px;color:var(--ink-soft);}
  @media (max-width:700px){ .tabs{grid-template-columns:1fr 1fr;} .tab-sub{display:none;} }

  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(22px,4vw,40px);}
  .eyebrow{font-size:12px;font-weight:600;color:var(--green-700);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px;}
  .step-title{font-size:clamp(19px,2.2vw,24px);font-weight:600;margin:0 0 8px;color:var(--green-900);letter-spacing:-0.01em;}
  .step-sub{font-size:14px;color:var(--ink-soft);margin:0 0 24px;max-width:620px;}

  label.field-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  label.field-label .req{color:var(--coral);margin-left:2px;}
  .hint{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  input[type=text], input[type=email], input[type=tel], select, textarea{width:100%;min-height:44px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);background:var(--paper);}
  select{height:44px;padding:0 14px;}
  textarea{resize:vertical;min-height:88px;line-height:1.5;}
  input::placeholder, textarea::placeholder{color:#A9B6B0;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100);}
  .field{margin-bottom:16px;}
  .field.err input, .field.err select, .field.err textarea{border-color:var(--red-line);background:var(--red-bg);}
  .err-msg{font-size:12px;color:var(--red);margin:5px 0 0;font-weight:500;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}

  /* grid de seguradoras */
  .insurer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;}
  .icard{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s;background:var(--paper);}
  .icard:hover{border-color:var(--green-500);}
  .icard .name{font-size:13.5px;font-weight:600;color:var(--ink);}
  .icard.on{border-color:var(--green-600);background:var(--green-50);box-shadow:0 0 0 3px var(--green-100);}
  .icard.on .name{color:var(--green-700);}
  .icard.blocked{background:var(--coral-bg);border-color:#EFC3AE;cursor:not-allowed;opacity:.85;}
  .icard.blocked .name{color:#B0512C;}
  .icard.already{background:var(--green-100);border-color:var(--green-500);cursor:default;}
  .icard.already .name{color:var(--green-700);}
  .icard .badge{position:absolute;top:6px;right:8px;font-size:10px;}
  .mode-row{display:flex;gap:4px;margin-top:8px;}
  .mode-pill{flex:1;font-size:9px;line-height:1.25;padding:5px 3px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;text-align:center;}
  .mode-pill.on{background:var(--green-600);border-color:var(--green-600);color:#fff;font-weight:600;}
  .mode-pill.on.transfer{background:#B9701A;border-color:#B9701A;}

  .yn-row{display:flex;gap:10px;margin-top:8px;margin-bottom:20px;}
  .yn{flex:1;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;}
  .yn:hover{border-color:var(--green-500);}
  .yn.on{background:var(--green-50);border-color:var(--green-600);color:var(--green-700);font-weight:600;}
  .q-block.err .yn{border-color:var(--red-line);}
  .q-label{font-size:14.5px;font-weight:500;color:var(--ink);margin:0 0 2px;}
  .q-label .req{color:var(--coral);margin-left:2px;}

  .section{margin-bottom:28px;}
  .section-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:16px;border-bottom:1.5px solid var(--line);}
  .section-head .num{width:22px;height:22px;border-radius:50%;background:var(--green-900);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .section-head .t{font-size:15px;font-weight:700;color:var(--green-900);}

  /* checklist de documentos */
  .doc-row{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--paper);}
  .doc-row .ic{width:26px;height:26px;border-radius:50%;background:var(--green-50);border:1.5px solid var(--green-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:var(--green-700);font-weight:700;}
  .doc-row .txt{font-size:13.5px;color:var(--ink);}
  .doc-row .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .checkline{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--paper);transition:all .15s;}
  .checkline:hover{border-color:var(--green-500);}
  .checkline.on{border-color:var(--green-600);background:var(--green-50);}
  .checkline.err{border-color:var(--red-line);background:var(--red-bg);}
  .checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:var(--paper);margin-top:1px;}
  .checkline.on .checkbox{background:var(--green-600);border-color:var(--green-600);color:#fff;}
  .checkline .txt{font-size:13.5px;color:var(--ink);}

  .partner-add{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1.5px dashed var(--green-600);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--green-700);cursor:pointer;margin-bottom:22px;}
  .partner-add.on{border-style:solid;background:var(--green-50);}

  .summary-block{background:var(--green-50);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .summary-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;}
  .summary-label.g{color:var(--green-700);}
  .pill{display:inline-block;font-size:13px;padding:5px 12px;border-radius:999px;margin:0 6px 6px 0;font-weight:500;}
  .pill.g{background:var(--green-100);color:var(--green-700);}

  .kv{display:grid;grid-template-columns:minmax(140px,180px) 1fr;gap:6px 16px;font-size:13.5px;margin-top:6px;}
  .kv dt{color:var(--ink-soft);}
  .kv dd{margin:0;color:var(--ink);font-weight:500;word-break:break-word;}
  @media (max-width:480px){ .kv{grid-template-columns:1fr;gap:0 0;} .kv dt{margin-top:8px;} }

  .notebox{background:var(--coral-bg);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:13px;color:#8A3A1E;}
  .notebox b{display:block;margin-bottom:2px;}
  .infobox{background:var(--green-50);border-radius:12px;padding:14px 16px;margin-top:8px;font-size:13px;color:var(--green-900);}
  .errbox{background:var(--red-bg);border:1px solid var(--red-line);border-radius:12px;padding:13px 16px;margin-top:16px;font-size:13px;color:var(--red);font-weight:500;}

  .nav{display:flex;gap:12px;margin-top:28px;}
  button{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;border-radius:11px;cursor:pointer;transition:all .15s;padding:0 20px;height:46px;}
  .btn-back{flex:0 0 auto;background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
  .btn-back:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-next{flex:1;background:var(--green-700);border:1.5px solid var(--green-700);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn-next:hover{background:var(--green-900);border-color:var(--green-900);}
  .btn-next:disabled{background:#B9C8C2;border-color:#B9C8C2;cursor:not-allowed;}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
  .btn-next.loading .spinner{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .done-screen{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px 0;}
  .done-badge{width:56px;height:56px;border-radius:50%;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .protocol{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--green-50);border:1px solid var(--green-100);color:var(--green-700);padding:8px 12px;border-radius:8px;}

  .draft-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:16px;}
  .draft-note a{color:var(--green-700);cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brandmark"><span class="dot"></span>segura<span style="color:var(--green-600)">.ai</span></div>
  <div class="topbar-meta">Cadastro e Nomeação · Seguradoras</div>
</div>

<div class="shell">
  <div id="setup-warn"></div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="card">
    <div id="content"></div>
    <div id="form-error"></div>
    <div class="nav" id="nav">
      <button class="btn-back" id="back" type="button">Anterior</button>
      <button class="btn-next" id="next" type="button"><span class="spinner"></span><span id="next-label">Continuar</span></button>
    </div>
  </div>
  <p class="draft-note" id="draft-note"></p>
</div>

<script>
/* ============================================================================
   CONFIGURAÇÃO — edite apenas este bloco
   ---------------------------------------------------------------------------
   1) Crie um Zap no Zapier com o trigger "Webhooks by Zapier → Catch Hook".
   2) Copie a URL que o Zapier gera (algo como
      https://hooks.zapier.com/hooks/catch/123456/abcdef/) e cole abaixo.
   ========================================================================== */
const CONFIG = {
  WEBHOOK_URL: "https://hooks.zapier.com/hooks/catch/18962926/4d4fgfv/",
  EMAIL_SUPORTE: "cadastro@sejasegura.com.br"
};
/* ========================================================================== */

const insurers = ["Akad", "AXA", "Bradesco Auto e Re", "Bradesco Vida e Previdência", "Darwin", "HDI", "Icatu", "Junto", "Justos", "MetLife", "Suhai", "Tokio", "Yelum", "Youse", "Aliro"];

// Overlap simetrizado (se A bloqueia B ou B bloqueia A, os dois se bloqueiam).
const OVERLAP = {
  "Akad": ["Tokio"],
  "AXA": ["Bradesco Auto e Re","Bradesco Vida e Previdência","HDI","Suhai","Tokio","Yelum"],
  "Bradesco Auto e Re": ["AXA","HDI","Suhai","Tokio","Yelum"],
  "Bradesco Vida e Previdência": ["AXA","HDI","Icatu","MetLife","Tokio"],
  "Darwin": ["Tokio"],
  "HDI": ["AXA","Bradesco Auto e Re","Bradesco Vida e Previdência","MetLife","Suhai","Tokio"],
  "Icatu": ["Bradesco Vida e Previdência","MetLife","Tokio"],
  "Junto": ["Tokio"],
  "Justos": ["Tokio"],
  "MetLife": ["Bradesco Vida e Previdência","HDI","Icatu","Tokio","Yelum"],
  "Suhai": ["AXA","Bradesco Auto e Re","HDI","Tokio","Yelum"],
  "Tokio": ["Akad","AXA","Bradesco Auto e Re","Bradesco Vida e Previdência","Darwin","HDI","Icatu","Junto","Justos","MetLife","Suhai","Yelum","Youse"],
  "Yelum": ["AXA","Bradesco Auto e Re","MetLife","Suhai","Tokio"],
  "Youse": ["Tokio"]
};

const GENERAL_DOCS = [
  'Cópia do Contrato Social, com a última Alteração Contratual (se houver)',
  'Cópia do Cartão CNPJ da empresa',
  'Cópia de documento onde conste a Inscrição na Prefeitura',
  'Cópia da credencial SUSEP da empresa (ativa no momento do cadastro)',
  'Cópia do comprovante bancário',
  'Cópia da credencial SUSEP do responsável pela empresa',
  'Cópia do RG e CPF dos sócios',
  'Cópia de comprovante de endereço (água, energia, gás, IPTU etc.)',
  'Cadastro no Simples Nacional (se aplicável)'
];

const TABS = [
  {key:'seguradora', title:'Seguradora', sub:'Selecione as seguradoras'},
  {key:'dados', title:'Dados cadastrais', sub:'Informações necessárias'},
  {key:'documentos', title:'Documentos', sub:'O que vamos pedir'},
  {key:'finalizar', title:'Finalizar', sub:'Revise e envie'}
];

const DRAFT_KEY = 'segura_cadastro_rascunho_v1';

const S = {
  jaAtendido:null,
  jaSeguradoras:new Set(),
  novas:{},
  v:{},
  secondPartner:false,
  cienteDocs:false,
  errors:{},
  touched:{},
  submitting:false,
  submitError:''
};
let tabIdx = 0;

/* ---------------- persistência local (rascunho) ---------------- */
function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      jaAtendido:S.jaAtendido,
      jaSeguradoras:[...S.jaSeguradoras],
      novas:S.novas, v:S.v,
      secondPartner:S.secondPartner,
      cienteDocs:S.cienteDocs,
      tabIdx:tabIdx,
      ts:Date.now()
    }));
  }catch(e){}
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY); if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || (Date.now() - (d.ts||0)) > 1000*60*60*24*30) return false;
    S.jaAtendido = d.jaAtendido || null;
    S.jaSeguradoras = new Set(d.jaSeguradoras||[]);
    S.novas = d.novas || {};
    S.v = d.v || {};
    S.secondPartner = !!d.secondPartner;
    S.cienteDocs = !!d.cienteDocs;
    tabIdx = Math.min(d.tabIdx||0, 3);
    return Object.keys(S.v).length>0 || Object.keys(S.novas).length>0;
  }catch(e){ return false; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function digits(s){ return String(s||'').replace(/\D/g,''); }

function maskDoc(v){ // CPF ou CNPJ
  const d = digits(v).slice(0,14);
  if(d.length<=11) return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
}
function maskCPF(v){ const d=digits(v).slice(0,11); return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function maskPhone(v){ const d=digits(v).slice(0,11); if(d.length<=10) return d.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d{1,4})$/,'$1-$2'); return d.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2'); }
function maskCEP(v){ const d=digits(v).slice(0,8); return d.replace(/^(\d{5})(\d)/,'$1-$2'); }
function maskDate(v){ const d=digits(v).slice(0,8); return d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2})\/(\d{2})(\d)/,'$1/$2/$3'); }
const MASKS = { doc:maskDoc, cpf:maskCPF, phone:maskPhone, cep:maskCEP, date:maskDate };

function validCPF(v){
  const c = digits(v); if(c.length!==11 || /^(\d)\1{10}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=parseInt(c[i])*(10-i);
  let r=(s*10)%11; if(r===10) r=0; if(r!==parseInt(c[9])) return false;
  s=0; for(let i=0;i<10;i++) s+=parseInt(c[i])*(11-i);
  r=(s*10)%11; if(r===10) r=0; return r===parseInt(c[10]);
}
function validCNPJ(v){
  const c = digits(v); if(c.length!==14 || /^(\d)\1{13}$/.test(c)) return false;
  const calc=(len)=>{ let n=0,p=len-7; for(let i=len;i>=1;i--){ n+=parseInt(c[len-i])*p--; if(p<2)p=9; } const r=n%11; return r<2?0:11-r; };
  return calc(12)===parseInt(c[12]) && calc(13)===parseInt(c[13]);
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }
function validPhone(v){ const d=digits(v); return d.length===10 || d.length===11; }

function personTypeFromDoc(){
  const d = digits(S.v['cnpj_corretora']);
  if(d.length===14) return 'CNPJ';
  if(d.length===11) return 'CPF';
  return null;
}
function novasList(){ return Object.keys(S.novas).filter(n=>S.novas[n].mode==='novo'); }
function transferList(){ return Object.keys(S.novas).filter(n=>S.novas[n].mode==='transferencia'); }
function onlyTransfer(){ return Object.keys(S.novas).length>0 && novasList().length===0; }
function blockedSet(){
  const b = new Set();
  S.jaSeguradoras.forEach(n=>{ (OVERLAP[n]||[]).forEach(x=>b.add(x)); });
  return b;
}

/* ---------------- componentes ---------------- */
function icard(name, opts){
  opts = opts||{};
  const isSelected = !!S.novas[name];
  const isBlocked = opts.blocked && opts.blocked.has(name) && !S.jaSeguradoras.has(name);
  const isAlready = S.jaSeguradoras.has(name);
  let cls='icard'+(isSelected?' on':'')+(isBlocked?' blocked':'')+(isAlready?' already':'');
  if(isBlocked){
    const conflictWith = [...S.jaSeguradoras].find(j=>(OVERLAP[j]||[]).includes(name));
    return '<div class="'+cls+'" title="Conflito de overlap com '+esc(conflictWith)+'"><div class="name">'+esc(name)+'</div><div class="badge">🔒</div></div>';
  }
  if(isAlready){

/* ---------------- validação ---------------- */
function validate(key, opts){
  opts = opts||{};
  const e = {};
  const req = (k,msg)=>{ if(!String(S.v[k]||'').trim()) e[k]= msg||'Campo obrigatório.'; };

  if(key==='seguradora'){
    const d = digits(S.v['cnpj_corretora']);
    if(!d) e['cnpj_corretora']='Informe o CNPJ ou CPF da corretora.';
    else if(d.length!==11 && d.length!==14) e['cnpj_corretora']='Documento incompleto — informe 11 dígitos (CPF) ou 14 (CNPJ).';
    else if(d.length===11 && !validCPF(d)) e['cnpj_corretora']='CPF inválido.';
    else if(d.length===14 && !validCNPJ(d)) e['cnpj_corretora']='CNPJ inválido.';
    if(!S.jaAtendido) e['_jaAtendido']='Responda se você já é atendido pela Segura.';
    if(S.jaAtendido==='sim' && S.jaSeguradoras.size===0) e['_jaSeg']='Selecione ao menos uma seguradora em que já é atendido.';
    if(S.jaAtendido && Object.keys(S.novas).length===0) e['_novas']='Selecione ao menos uma seguradora em que quer ser atendido agora.';
  }

  if(key==='dados'){
    const light = onlyTransfer();
    req('nome_corretora','Informe o nome da corretora.');
    if(!validPhone(S.v['telefone_corretora'])) e['telefone_corretora']='Telefone inválido — use DDD + número.';
    req('susep','Informe o código SUSEP.');
    if(!validEmail(S.v['email_comercial'])) e['email_comercial']='E-mail inválido.';
    if(!light){
      req('ie'); req('im');
      if(!S.v['simples']) e['simples']='Selecione uma opção.';
      if(!S.v['porte']) e['porte']='Selecione o porte.';
      if(!S.v['multicalculo']) e['multicalculo']='Selecione uma opção.';
      if(!S.v['funcionarios']) e['funcionarios']='Selecione uma opção.';
      if(!S.v['apolices']) e['apolices']='Selecione uma opção.';
      if(!S.v['relac_funcionario']) e['relac_funcionario']='Selecione uma opção.';
      if(!S.v['pep']) e['pep']='Selecione uma opção.';
      if(!S.v['aml']) e['aml']='Selecione uma opção.';
      req('r1_nome','Informe o nome do responsável.');
      if(!validCPF(S.v['r1_cpf'])) e['r1_cpf']='CPF inválido.';
      req('r1_rg','Informe o RG.');
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(S.v['r1_nasc']||'')) e['r1_nasc']='Use o formato DD/MM/AAAA.';
      if(!validEmail(S.v['r1_email'])) e['r1_email']='E-mail inválido.';
      if(!validPhone(S.v['r1_tel'])) e['r1_tel']='Telefone inválido.';
      if(S.secondPartner){
        req('r2_nome','Informe o nome do 2º responsável.');
        if(!validCPF(S.v['r2_cpf'])) e['r2_cpf']='CPF inválido.';
        if(S.v['r2_email'] && !validEmail(S.v['r2_email'])) e['r2_email']='E-mail inválido.';
        if(S.v['r2_tel'] && !validPhone(S.v['r2_tel'])) e['r2_tel']='Telefone inválido.';
      }
    }
    req('banco','Informe o banco.'); req('agencia','Informe a agência.'); req('conta','Informe a conta.');
    req('endereco','Informe o endereço comercial.');
    if(digits(S.v['cep']).length!==8) e['cep']='CEP incompleto.';
    req('numero','Informe o número.');
  }

  if(key==='documentos'){
    if(!S.cienteDocs) e['_ciente']='Confirme que está ciente dos documentos necessários.';
  }
  return e;
}
function stepValid(key){ return Object.keys(validate(key)).length===0; }
function maxReachable(){
  if(!stepValid('seguradora')) return 0;
  if(!stepValid('dados')) return 1;
  if(!stepValid('documentos')) return 2;
  return 3;
}

function buildTabs(){
  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>{
    let cls = 'tab';
    if(i===tabIdx) cls+=' active'; else if(i<tabIdx) cls+=' done'; else if(i>maxReachable()) cls+=' locked';
    return '<div class="'+cls+'" data-idx="'+i+'"><span class="tab-num">'+(i+1)+'</span><div><div class="tab-title">'+esc(t.title)+'</div><div class="tab-sub">'+esc(t.sub)+'</div></div></div>';
  }).join('');
}

function docsPendentes(){

}

    seguradoras_ja_atendido: [...S.jaSeguradoras].join(', '),
    seguradoras_cadastro_novo: novo.join(', '),
    seguradoras_transferencia: transf.join(', '),
    qtd_cadastro_novo: String(novo.length),
    qtd_transferencia: String(transf.length),
    tipo_solicitacao: novo.length && transf.length ? 'Misto' : (novo.length ? 'Cadastro novo' : 'Transferência'),
    inscricao_estadual: S.v['ie']||'',
    inscricao_municipal: S.v['im']||'',
    optante_simples: S.v['simples']||'',
    porte: S.v['porte']||'',
    aliquota: S.v['aliquota']||'',
    multicalculo: S.v['multicalculo']||'',
    funcionarios: S.v['funcionarios']||'',
    apolices_mes: S.v['apolices']||'',
    relacionamento_funcionario: S.v['relac_funcionario']||'',
    vinculo_pep: S.v['pep']||'',
    politica_pld_ft: S.v['aml']||'',
    resp1_nome: S.v['r1_nome']||'', resp1_cpf: S.v['r1_cpf']||'', resp1_rg: S.v['r1_rg']||'',
    resp1_nascimento: S.v['r1_nasc']||'', resp1_email: S.v['r1_email']||'', resp1_telefone: S.v['r1_tel']||'',
    resp2_nome: S.v['r2_nome']||'', resp2_cpf: S.v['r2_cpf']||'', resp2_rg: S.v['r2_rg']||'',
    resp2_nascimento: S.v['r2_nasc']||'', resp2_email: S.v['r2_email']||'', resp2_telefone: S.v['r2_tel']||'',
    banco: S.v['banco']||'', agencia: S.v['agencia']||'', conta: S.v['conta']||'', pix: S.v['pix']||'',
    endereco: S.v['endereco']||'', numero: S.v['numero']||'', complemento: S.v['complemento']||'',
    cidade_uf: S.v['cidade_uf']||'', cep: S.v['cep']||'',
    observacoes: S.v['observacoes']||'',
    documentos_pendentes: pend.join('\n• '),
    qtd_documentos_pendentes: String(pend.length),
    origem: location.href
  };
  p.slack_text = buildSlackText(p);
  p.slack_blocks = JSON.stringify(buildSlackBlocks(p));
  return p;
}

function buildSlackText(p){
  const L = [];
  L.push('*Novo cadastro de corretora* · '+p.tipo_solicitacao);
  L.push('*'+(p.nome_corretora||'—')+'*  ·  '+(p.cnpj_corretora||'—')+'  ·  SUSEP '+(p.susep||'—'));
  L.push('');
  if(p.seguradoras_cadastro_novo) L.push('🆕 *Cadastro novo:* '+p.seguradoras_cadastro_novo);
  if(p.seguradoras_transferencia) L.push('🔁 *Transferência:* '+p.seguradoras_transferencia);
  if(p.seguradoras_ja_atendido) L.push('✅ *Já atendido:* '+p.seguradoras_ja_atendido);
  L.push('');
  L.push('*Contato:* '+(p.resp1_nome||'—')+' · '+(p.resp1_email||p.email_comercial||'—')+' · '+(p.resp1_telefone||p.telefone_corretora||'—'));
  L.push('*E-mail comercial:* '+(p.email_comercial||'—'));
  L.push('*Endereço:* '+[p.endereco,p.numero,p.complemento,p.cidade_uf,p.cep].filter(Boolean).join(', '));
  L.push('*Banco:* '+[p.banco, p.agencia && ('Ag. '+p.agencia), p.conta && ('CC '+p.conta), p.pix && ('Pix '+p.pix)].filter(Boolean).join(' · '));
  if(p.porte) L.push('*Perfil:* '+[p.porte, p.multicalculo && ('multicálculo '+p.multicalculo), p.funcionarios && (p.funcionarios+' func.'), p.apolices_mes && (p.apolices_mes+' apólices/mês')].filter(Boolean).join(' · '));
  const flags = [];
  if(p.vinculo_pep==='sim') flags.push('vínculo com PEP');
  if(p.relacionamento_funcionario==='sim') flags.push('relacionamento com funcionário de seguradora');
  if(p.politica_pld_ft==='nao') flags.push('sem política de PLD/FT');
  if(flags.length) L.push('⚠️ *Atenção:* '+flags.join(' · '));
  if(p.observacoes) L.push('*Observações:* '+p.observacoes);
  L.push('');
  L.push('*Documentos a solicitar ('+p.qtd_documentos_pendentes+'):*\n• '+p.documentos_pendentes);
  L.push('');
  L.push('_Protocolo '+p.protocolo+' · '+p.data_envio+'_');
  return L.join('\n');
}

function buildSlackBlocks(p){
  const fields = [
    ['Tipo', p.tipo_solicitacao],
    ['CNPJ/CPF', p.cnpj_corretora],
    ['SUSEP', p.susep],
    ['E-mail comercial', p.email_comercial],
    ['Responsável', p.resp1_nome],
    ['Telefone', p.resp1_telefone||p.telefone_corretora]
  ].filter(f=>f[1]).map(f=>({type:'mrkdwn', text:'*'+f[0]+'*\n'+f[1]}));

  const blocks = [
    {type:'header', text:{type:'plain_text', text:'Novo cadastro: '+(p.nome_corretora||'corretora sem nome'), emoji:true}},
    {type:'section', fields:fields}
  ];
  const segLines = [];
  if(p.seguradoras_cadastro_novo) segLines.push('🆕 *Cadastro novo:* '+p.seguradoras_cadastro_novo);
  if(p.seguradoras_transferencia) segLines.push('🔁 *Transferência:* '+p.seguradoras_transferencia);
  if(p.seguradoras_ja_atendido) segLines.push('✅ *Já atendido:* '+p.seguradoras_ja_atendido);
  if(segLines.length) blocks.push({type:'section', text:{type:'mrkdwn', text:segLines.join('\n')}});

  const flags = [];
  if(p.vinculo_pep==='sim') flags.push('vínculo com PEP');
  if(p.relacionamento_funcionario==='sim') flags.push('relacionamento com funcionário de seguradora');
  if(p.politica_pld_ft==='nao') flags.push('sem política de PLD/FT');
  if(flags.length) blocks.push({type:'section', text:{type:'mrkdwn', text:'⚠️ *Atenção:* '+flags.join(' · ')}});

  blocks.push({type:'section', text:{type:'mrkdwn', text:'*Documentos a solicitar ('+p.qtd_documentos_pendentes+'):*\n• '+p.documentos_pendentes}});
  if(p.observacoes) blocks.push({type:'section', text:{type:'mrkdwn', text:'*Observações:* '+p.observacoes}});
  blocks.push({type:'context', elements:[{type:'mrkdwn', text:'Protocolo `'+p.protocolo+'` · '+p.data_envio+' · endereço: '+[p.endereco,p.numero,p.cidade_uf,p.cep].filter(Boolean).join(', ')}]});
  return blocks;
}

/* ---------------- envio ---------------- */
async function submitForm(){
  if(!CONFIG.WEBHOOK_URL || CONFIG.WEBHOOK_URL.indexOf('http')!==0){
    S.submitError = 'O formulário ainda não está conectado ao canal de envio. Avise o time da Segura.';
    render(); return;
  }
  S.submitting = true; S.submitError=''; render();
  const payload = buildPayload();
  const body = new URLSearchParams(payload); // form-urlencoded = sem preflight CORS
  let ok = false;
  try{
    const res = await fetch(CONFIG.WEBHOOK_URL, {method:'POST', body:body});
    ok = res.ok || res.type === 'opaque';
  }catch(err){
    try{ // fallback: o POST chega, só não conseguimos ler a resposta
      await fetch(CONFIG.WEBHOOK_URL, {method:'POST', mode:'no-cors', body:body});
      ok = true;
    }catch(e2){ ok = false; }
  }
  S.submitting = false;
  if(ok){ clearDraft(); showDone(payload.protocolo); }
  else { S.submitError = 'Não conseguimos enviar agora. Verifique sua conexão e tente de novo — ou mande os dados para '+CONFIG.EMAIL_SUPORTE+'.'; render(); }
}

function showDone(protocolo){
  document.getElementById('tabs').style.display='none';
  document.getElementById('draft-note').innerHTML='';
  document.getElementById('card').innerHTML = '<div class="done-screen">'
    + '<div class="done-badge">✓</div>'
    + '<h2 class="step-title" style="margin-top:4px;">Cadastro enviado</h2>'
    + '<p class="step-sub" style="max-width:520px;">Ficamos muito felizes em saber que você deseja contar com o suporte comercial da Segura. Nosso time de cadastro vai entrar em contato pelo e-mail informado com os modelos de documento e o passo a passo de cada seguradora. 💚</p>'
    + '<div class="protocol">Protocolo '+esc(protocolo)+'</div>'
    + '</div>';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- eventos ---------------- */
function goNext(){
  const key = TABS[tabIdx].key;
  S.errors = validate(key);
  if(Object.keys(S.errors).length){
    render();
    const first = document.querySelector('.field.err, .q-block.err, .checkline.err, .err-msg');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(tabIdx < TABS.length-1){ tabIdx++; S.errors={}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else { submitForm(); }
}

function attachHandlers(){
  document.getElementById('tabs').addEventListener('click', e=>{
    const t = e.target.closest('.tab'); if(!t) return;
    const idx = parseInt(t.dataset.idx,10);
    if(idx<=maxReachable()){ tabIdx = idx; S.errors={}; render(); }
  });

  document.getElementById('content').addEventListener('click', e=>{
    const modePill = e.target.closest('[data-modefor]');
    if(modePill){
      const n = modePill.dataset.modefor;
      if(S.novas[n]){ S.novas[n].mode = modePill.dataset.mode; }
      render(); return;
    }
    const ic = e.target.closest('.icard');
    if(ic && ic.dataset.select){
      const n = ic.dataset.select;
      if(S.novas[n]) delete S.novas[n]; else S.novas[n] = {mode:'novo'};
      delete S.errors['_novas']; render(); return;
    }
    if(ic && ic.dataset.jaseg){
      const n = ic.dataset.jaseg;
      S.jaSeguradoras.has(n) ? S.jaSeguradoras.delete(n) : S.jaSeguradoras.add(n);
      if(S.novas[n]) delete S.novas[n];
      delete S.errors['_jaSeg']; render(); return;
    }
    const yn = e.target.closest('.yn');
    if(yn){
      if(yn.dataset.key==='jaAtendido'){
        S.jaAtendido = yn.dataset.val;
        if(yn.dataset.val==='nao'){ S.jaSeguradoras=new Set(); }
        delete S.errors['_jaAtendido'];
      } else {
        S.v[yn.dataset.key] = yn.dataset.val;
        delete S.errors[yn.dataset.key];
      }
      render(); return;
    }
    const ciente = e.target.closest('#ciente');
    if(ciente){ S.cienteDocs = !S.cienteDocs; delete S.errors['_ciente']; render(); return; }
    const partnerToggle = e.target.closest('#partner-toggle');
    if(partnerToggle){ S.secondPartner = !S.secondPartner; render(); return; }
  });

  document.getElementById('content').addEventListener('input', e=>{
    const k = e.target.dataset.key; if(!k) return;
    const m = e.target.dataset.mask;
    if(m && MASKS[m]){
      const atEnd = e.target.selectionStart === e.target.value.length;
      const masked = MASKS[m](e.target.value);
      if(masked !== e.target.value){
        e.target.value = masked;
        if(atEnd) e.target.setSelectionRange(masked.length, masked.length);
      }
    }
    S.v[k] = e.target.value;
    if(S.errors[k]){
      delete S.errors[k];
      const f = e.target.closest('.field');
      if(f){ f.classList.remove('err'); const em=f.querySelector('.err-msg'); if(em) em.remove(); }
    }
    saveDraft();
  });

  document.getElementById('content').addEventListener('change', e=>{
    if(e.target.tagName==='SELECT' && e.target.dataset.key){
      S.v[e.target.dataset.key]=e.target.value;
      delete S.errors[e.target.dataset.key];
      render();
    }
  });

  document.getElementById('back').onclick = ()=>{ if(tabIdx>0){ tabIdx--; S.errors={}; render(); window.scrollTo({top:0,behavior:'smooth'}); } };
  document.getElementById('next').onclick = goNext;

  document.getElementById('draft-note').addEventListener('click', e=>{
    if(e.target.id!=='reset-draft') return;
    clearDraft();
    S.jaAtendido=null; S.jaSeguradoras=new Set(); S.novas={}; S.v={};
    S.secondPartner=false; S.cienteDocs=false; S.errors={}; S.submitError='';
    tabIdx=0; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
}

if(!CONFIG.WEBHOOK_URL || CONFIG.WEBHOOK_URL.indexOf('http')!==0){
  document.getElementById('setup-warn').innerHTML =
    '<div class="setup-warn"><b>Configuração pendente:</b> cole a URL do Catch Hook do Zapier em <code>CONFIG.WEBHOOK_URL</code>, no topo do &lt;script&gt; deste arquivo. Enquanto isso, o envio fica bloqueado.</div>';
}

loadDraft();
attachHandlers();
render();
</script>
